apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-default-deny" (include "aidacrm.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidacrm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aidacrm
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public ingress is HTTPS/443 only and terminates before this pod; internal traffic reaches TCP/3000.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Standard NetworkPolicy cannot select the runtime-configured AIDA FQDN.
    # Limit external egress to HTTPS and rely on the enforced HTTPS URL and tenant-scoped server token.
    - ports:
        - protocol: TCP
          port: 443
